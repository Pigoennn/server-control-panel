# Vanilla Minecraft server for testing (no mods, so friends can join with
# a plain launcher). Its own Compose project and world volume, separate
# from the modded server in ../minecraft.
#
# It uses the same port as the modded server, so the playit tunnel
# (127.0.0.1:25565) reaches whichever one is running. Only one can run at a
# time: stop the other first, or `up` fails with "port is already allocated".
#
#   docker compose -f deploy/minecraft-vanilla/compose.yaml up -d
#   docker compose -f deploy/minecraft-vanilla/compose.yaml stop
name: minecraft-vanilla

services:
  minecraft-vanilla:
    # Minecraft 26.x needs Java 25. Pinned like the modded server.
    image: itzg/minecraft-server:java25
    container_name: minecraft-vanilla

    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      # Pinned so an image update can't upgrade the world under us.
      VERSION: "26.3"
      # Vanilla needs far less than the 359-mod pack.
      MEMORY: 2G

      # Same rules as the modded server: the playit address is public.
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: |
        Pigoenn
        probitbit
      EXISTING_WHITELIST_FILE: MERGE
      OPS: |
        Pigoenn
        probitbit
      EXISTING_OPS_FILE: MERGE

      # RCON lets the control API ask who's online. The image enables RCON
      # already; this sets the password from .env next to this file (cp
      # .env.example .env). Compose refuses to start without it.
      RCON_PASSWORD: ${MC_RCON_PASSWORD:?set MC_RCON_PASSWORD in .env next to this file}

    volumes:
      - minecraft-vanilla-data:/data

    ports:
      # Localhost only (Docker-published ports bypass ufw); playit forwards.
      - "127.0.0.1:25565:25565"
      # RCON for the API's player list. Localhost only: RCON can run any
      # server command, so it must never be reachable from outside.
      - "127.0.0.1:25575:25575"

    mem_limit: 3g
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
    stop_grace_period: 1m
    restart: "no"
    stdin_open: true
    tty: true

volumes:
  minecraft-vanilla-data:
    name: minecraft-vanilla-data
